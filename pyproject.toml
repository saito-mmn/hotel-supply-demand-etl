[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-supply-demand-etl"
version = "2.0.0"
description = "Reproducible ETL for Japan Tourism Agency hotel market statistics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "saito-structural-data" }]
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.scripts]
hotel-etl = "hotel_supply_demand.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
