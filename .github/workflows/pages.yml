name: Deploy static demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "reports/latest/**"
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - "scripts/prepare_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Restore latest successful official-data state
        uses: actions/cache/restore@v4
        with:
          path: |
            .update-state
            data/raw
            data/processed
          key: hotel-update-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hotel-update-${{ runner.os }}-

      - name: Require a restored database
        run: test -f data/processed/hotel_market.sqlite3

      - name: Regenerate reports with current code and latest data
        run: |
          hotel-etl monitor
          hotel-etl municipality-report

      - name: Prepare and validate public files
        run: python3 scripts/prepare_pages.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
