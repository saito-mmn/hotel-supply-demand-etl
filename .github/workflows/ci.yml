name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting and lint
        run: >-
          ruff format --check
          scripts/check_update_result.py
          scripts/validate_repository.py
          tests/test_phase6_scripts.py &&
          ruff check --select E4,E7,E9,F src tests scripts

      - name: Check types
        run: >-
          mypy
          scripts
          src/hotel_supply_demand/update.py
          src/hotel_supply_demand/municipality/discovery.py
          src/hotel_supply_demand/prefecture/discovery.py

      - name: Run unit and fixture integration tests
        run: python -m unittest discover -s tests -v

      - name: Check tracked files and patch whitespace
        run: python scripts/validate_repository.py && git diff --check

      - name: Validate generated HTML and internal links
        run: python scripts/prepare_pages.py
