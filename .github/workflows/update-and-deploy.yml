name: Update official data and deploy

on:
  schedule:
    # Monthly second-preliminary publication dates vary, so check weekly.
    - cron: "17 1 * * 2"
    # Annual-final publication/revision window: twice monthly from June through August.
    - cron: "43 1 1,15 6-8 *"
  workflow_dispatch:
    inputs:
      domain:
        description: Official-data domain to check
        required: true
        default: all
        type: choice
        options:
          - all
          - municipality
          - prefecture
      deploy_without_update:
        description: Deploy the currently generated report even when no data changed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run code quality gates before external access
        run: >-
          ruff format --check
          scripts/check_update_result.py
          scripts/validate_repository.py
          tests/test_phase6_scripts.py &&
          ruff check --select E4,E7,E9,F src tests scripts &&
          mypy
          scripts
          src/hotel_supply_demand/update.py
          src/hotel_supply_demand/municipality/discovery.py
          src/hotel_supply_demand/prefecture/discovery.py &&
          python -m unittest discover -s tests -v &&
          python scripts/validate_repository.py

      - name: Restore previous successful update state
        uses: actions/cache@v4
        with:
          path: |
            .update-state
            data/raw
            data/processed
          key: hotel-update-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hotel-update-${{ runner.os }}-

      - name: Restore generated reports and adopted source configuration
        run: |
          if [ -d .update-state/reports ]; then cp -R .update-state/reports/. reports/latest/; fi
          if [ -f .update-state/prefecture_sources.toml ]; then
            cp .update-state/prefecture_sources.toml config/prefecture_sources.toml
          elif [ -f .update-state/sources.toml ]; then
            cp .update-state/sources.toml config/prefecture_sources.toml
          fi
          if [ -f .update-state/municipality_sources.toml ]; then
            cp .update-state/municipality_sources.toml config/municipality_sources.toml
          fi

      - name: Select scheduled update domain
        id: domain
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_DOMAIN: ${{ inputs.domain }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            domain="$REQUESTED_DOMAIN"
          elif [ "$EVENT_SCHEDULE" = "43 1 1,15 6-8 *" ]; then
            domain="prefecture"
          else
            domain="municipality"
          fi
          echo "domain=$domain" >> "$GITHUB_OUTPUT"

      - name: Fetch, validate, load, and regenerate reports
        run: hotel-etl update --domain "${{ steps.domain.outputs.domain }}" > update-result.json

      - name: Stop before publication when human review is required
        id: update_result
        run: python scripts/check_update_result.py update-result.json --github-output

      - name: Validate public artifact
        run: python scripts/prepare_pages.py

      - name: Save successful generated state for the next run
        run: |
          mkdir -p .update-state/reports
          cp -R reports/latest/. .update-state/reports/
          cp config/prefecture_sources.toml config/municipality_sources.toml .update-state/

      - name: Decide whether deployment is needed
        id: decision
        env:
          UPDATED: ${{ steps.update_result.outputs.updated }}
          FORCE_DEPLOY: ${{ inputs.deploy_without_update }}
        run: |
          if [ "$UPDATED" = "true" ] || [ "$FORCE_DEPLOY" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload update audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-update-audit-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            update-result.json
            config/prefecture_sources.toml
            config/municipality_sources.toml
            data/raw/manifest.json
            data/raw/municipality/manifest.json

      - name: Configure GitHub Pages
        if: steps.decision.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    needs: update
    if: needs.update.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
